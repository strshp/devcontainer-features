name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Validate devcontainer-feature.json files"
        run: |
          set -e
          for f in src/*/devcontainer-feature.json; do
            python3 -c "import json; json.load(open('$f'))"
            echo "$f: JSON OK"
          done

      - name: "Validate install.sh shell syntax"
        run: |
          set -e
          for f in src/*/install.sh; do
            sh -n "$f"
            echo "$f: shell syntax OK"
          done

  test-claude-code-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Set up test workspace"
        run: |
          set -e
          WS=/tmp/cc-test
          mkdir -p "$WS/.devcontainer/claude-projects"
          mkdir -p "$HOME/.claude/skills"
          touch "$HOME/.claude/settings.json" "$HOME/.claude/settings.local.json"
          cp -r src/claude-code-persist "$WS/.devcontainer/"
          cat > "$WS/.devcontainer/devcontainer.json" <<'JSON'
          {
              "image": "mcr.microsoft.com/devcontainers/base:ubuntu",
              "features": { "./claude-code-persist": {} },
              "remoteUser": "vscode"
          }
          JSON

      - name: "Bring up devcontainer"
        working-directory: /tmp/cc-test
        run: devcontainer up --workspace-folder .

      - name: "Verify symlinks and functional persistence inside container"
        working-directory: /tmp/cc-test
        run: |
          devcontainer exec --workspace-folder . bash -c '
            set -e

            fail() { echo "FAIL: $1"; exit 1; }

            test -L /home/vscode/.claude       || fail "/home/vscode/.claude is not a symlink"
            test -L /home/vscode/.claude.json  || fail "/home/vscode/.claude.json is not a symlink"
            [ "$(readlink /home/vscode/.claude)"      = "/var/claude-code-global" ]              || fail "~/.claude target wrong"
            [ "$(readlink /home/vscode/.claude.json)" = "/var/claude-code-global/.claude.json" ] || fail "~/.claude.json target wrong"

            for n in projects todos shell-snapshots sessions session-env tasks plans file-history paste-cache history.jsonl; do
              test -L "/var/claude-code-global/$n"                                                   || fail "missing symlink: $n"
              [ "$(readlink /var/claude-code-global/$n)" = "/var/claude-code-projects/$n" ]          || fail "symlink target wrong: $n"
            done

            test -L /var/claude-code-global/skills                                                   || fail "skills is not a symlink"
            [ "$(readlink /var/claude-code-global/skills)" = "/var/claude-code-host-skills" ]        || fail "skills target wrong"

            test -L /var/claude-code-global/settings.json                                            || fail "settings.json is not a symlink"
            [ "$(readlink /var/claude-code-global/settings.json)" = "/var/claude-code-host-settings.json" ]             || fail "settings.json target wrong"
            test -L /var/claude-code-global/settings.local.json                                      || fail "settings.local.json is not a symlink"
            [ "$(readlink /var/claude-code-global/settings.local.json)" = "/var/claude-code-host-settings.local.json" ] || fail "settings.local.json target wrong"

            echo hello > /home/vscode/.claude/projects/.persist-test
            test -f /var/claude-code-projects/projects/.persist-test                                 || fail "write did not reach project bind mount"
            grep -q hello /var/claude-code-projects/projects/.persist-test                          || fail "wrong content on project bind mount"

            echo "All in-container checks passed."
          '

      - name: "Verify host-side persistence"
        run: |
          set -e
          test -f /tmp/cc-test/.devcontainer/claude-projects/projects/.persist-test
          grep -q hello /tmp/cc-test/.devcontainer/claude-projects/projects/.persist-test
          echo "Host-side bind mount verified."
