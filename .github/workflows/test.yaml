name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Validate devcontainer-feature.json files"
        run: |
          set -e
          for f in src/*/devcontainer-feature.json; do
            python3 -c "import json; json.load(open('$f'))"
            echo "$f: JSON OK"
          done

      - name: "Validate install.sh shell syntax"
        run: |
          set -e
          for f in src/*/install.sh; do
            sh -n "$f"
            echo "$f: shell syntax OK"
          done

  test-confluence-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Run feature tests (test.sh + scenarios)"
        run: |
          devcontainer features test \
            --features confluence-cli \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --project-folder .

  test-gh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Create the persistent store (bind source must exist)"
        run: mkdir -p "$HOME/.config/gh-devcontainers"

      - name: "Run feature tests (test.sh + scenarios)"
        run: |
          devcontainer features test \
            --features gh \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --project-folder .

  test-claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Set up test workspace"
        run: |
          set -e
          WS=/tmp/cc-test
          mkdir -p "$WS/.devcontainer"
          # Host-shared config + credentials are bind sources -> must exist on host.
          mkdir -p "$HOME/.claude/skills" "$HOME/.claude/commands" "$HOME/.claude/agents" \
                   "$HOME/.claude/output-styles" "$HOME/.claude/rules" "$HOME/.claude/workflows" \
                   "$HOME/.claude/themes" "$HOME/.claude/plugins"
          touch "$HOME/.claude/settings.json" "$HOME/.claude/settings.local.json" \
                "$HOME/.claude/keybindings.json" "$HOME/.claude/CLAUDE.md" \
                "$HOME/.claude/.credentials.json" "$HOME/.claude.json"
          cp -r src/claude-code "$WS/.devcontainer/"
          cat > "$WS/.devcontainer/devcontainer.json" <<'JSON'
          {
              "image": "mcr.microsoft.com/devcontainers/base:ubuntu-24.04",
              "features": { "./claude-code": {} },
              "remoteUser": "vscode"
          }
          JSON

      - name: "Bring up devcontainer"
        working-directory: /tmp/cc-test
        run: devcontainer up --workspace-folder .

      - name: "Verify wiring and functional persistence inside container"
        working-directory: /tmp/cc-test
        run: |
          devcontainer exec --workspace-folder . bash -c '
            set -e
            fail() { echo "FAIL: $1"; exit 1; }
            HOST=/var/claude-code-host

            # ~/.claude is the per-repo store inside the workspace .devcontainer.
            test -L /home/vscode/.claude || fail "~/.claude is not a symlink"
            case "$(readlink /home/vscode/.claude)" in
              */.devcontainer/claude-store) : ;;
              *) fail "~/.claude target wrong: $(readlink /home/vscode/.claude)" ;;
            esac
            test -d /home/vscode/.claude || fail "store dir missing"

            # ~/.claude.json shared from host.
            test -L /home/vscode/.claude.json || fail "~/.claude.json is not a symlink"
            [ "$(readlink /home/vscode/.claude.json)" = "/var/claude-code-host-claude-json" ] || fail "~/.claude.json target wrong"

            # Host-shared config + credential items point at the host mount.
            for n in .credentials.json settings.json settings.local.json keybindings.json CLAUDE.md \
                     skills commands agents output-styles rules workflows themes plugins; do
              [ "$(readlink /home/vscode/.claude/$n)" = "$HOST/$n" ] || fail "host-shared symlink wrong: $n"
            done

            # Runtime state stays in the per-repo store.
            mkdir -p /home/vscode/.claude/projects
            echo hello > /home/vscode/.claude/projects/.persist-test
            grep -q hello /home/vscode/.claude/projects/.persist-test || fail "runtime write failed"

            echo "All in-container checks passed."
          '

      - name: "Verify host-side persistence"
        run: |
          set -e
          WS=/tmp/cc-test
          test -f "$WS/.devcontainer/claude-store/projects/.persist-test"
          grep -q hello "$WS/.devcontainer/claude-store/projects/.persist-test"
          test -f "$WS/.devcontainer/claude-store/.gitignore"
          grep -q '^\*$' "$WS/.devcontainer/claude-store/.gitignore"
          test -f "$WS/.devcontainer/.gitignore"
          grep -qFx 'claude-store/' "$WS/.devcontainer/.gitignore"
          grep -qFx 'devcontainer-lock.json' "$WS/.devcontainer/.gitignore"
          grep -qFx '.gitignore' "$WS/.devcontainer/.gitignore"
          echo "Host-side persistence verified."
